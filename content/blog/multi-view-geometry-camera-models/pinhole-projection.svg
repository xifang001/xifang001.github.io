<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Pinhole camera projection</title>
  <desc id="desc">Two points along one camera ray project to the same point on the normalized image plane.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d6670"/>
    </marker>
    <style>
      .label { font: 28px 'Avenir Next', 'Helvetica Neue', sans-serif; fill: #223033; }
      .small { font: 22px 'Avenir Next', 'Helvetica Neue', sans-serif; fill: #637176; }
      .math { font: italic 27px Georgia, serif; fill: #223033; }
    </style>
  </defs>
  <rect x="8" y="8" width="1084" height="544" rx="34" fill="#f8faf9" stroke="#d4dfe1" stroke-width="2"/>

  <line x1="125" y1="280" x2="1010" y2="280" stroke="#afbdc0" stroke-width="2" stroke-dasharray="9 10"/>
  <text x="880" y="262" class="small">optical axis</text>

  <circle cx="180" cy="280" r="11" fill="#152124"/>
  <text x="95" y="330" class="label">camera center</text>
  <text x="163" y="370" class="math">C</text>

  <line x1="510" y1="90" x2="510" y2="470" stroke="#0d6670" stroke-width="6"/>
  <text x="430" y="70" class="label">normalized image plane</text>
  <text x="535" y="120" class="math">Z = 1</text>

  <line x1="180" y1="280" x2="945" y2="100" stroke="#c56535" stroke-width="4"/>
  <line x1="180" y1="280" x2="965" y2="465" stroke="#8e9a9d" stroke-width="3" opacity="0.55"/>

  <circle cx="510" cy="202.4" r="10" fill="#0d6670"/>
  <text x="530" y="195" class="math">x<tspan baseline-shift="sub" font-size="18">n</tspan></text>

  <circle cx="745" cy="147.1" r="12" fill="#c56535"/>
  <text x="765" y="135" class="math">X<tspan baseline-shift="sub" font-size="18">C</tspan></text>

  <circle cx="925" cy="104.7" r="8" fill="#c56535" opacity="0.62"/>
  <text x="940" y="91" class="math">λX<tspan baseline-shift="sub" font-size="18">C</tspan></text>

  <line x1="180" y1="510" x2="330" y2="510" stroke="#0d6670" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="340" y="519" class="math">Z<tspan baseline-shift="sub" font-size="18">C</tspan></text>
  <line x1="180" y1="510" x2="180" y2="400" stroke="#0d6670" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="142" y="405" class="math">Y<tspan baseline-shift="sub" font-size="18">C</tspan></text>

  <path d="M 525 330 C 620 360, 720 360, 830 330" fill="none" stroke="#d4dfe1" stroke-width="2"/>
  <text x="570" y="398" class="small">depth changes along the ray;</text>
  <text x="595" y="430" class="small">the image coordinate does not</text>
</svg>
