# ==============================================================================
# HUGO BLOX CONFIGURATION — MINIMAL ACADEMIC STYLE
# ==============================================================================

hugoblox:
  branding:
    name: "Xi Fang"
    site_title: "Xi Fang | Medical Imaging and Surgical AI"
    # organization: "Xi Fang"

  theme:
    mode: light       # 极简学术主页推荐固定 light
    pack: "default"
    # colors:
    #   primary: "indigo"
    #   neutral: "gray"

  typography:
    font: "sans"      # Inter — 现代、干净、学术风
    size: "md"

  layout:
    radius: "none"    # 去掉圆角，更接近 MIT/Stanford
    spacing: "comfortable"

# ==============================================================================
# SEO
# ==============================================================================
marketing:
  seo:
    site_type: Person
    description: "Xi Fang is a machine learning and research engineer working across robotics, computer vision, multimodal AI, and medical imaging."

  social:
    email: "xifang96@gmail.com"
    github: "https://github.com/xifang001"
    google_scholar: "https://scholar.google.com/citations?user=gXBde2IAAAAJ"
    linkedin: "https://www.linkedin.com/in/xi-fang-75734b153/"
    orcid: ""


# ==============================================================================
# HEADER
# ==============================================================================
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: false           # 极简风：去掉搜索
    show_mode_toggle: false      # 去掉主题切换按钮
    show_theme_picker: false

# ==============================================================================
# FOOTER
# ==============================================================================
footer:
  copyright:
    notice: "© {year} {name}"
    license:
      enable: false

# ==============================================================================
# FEATURES
# ==============================================================================
features:
  math:
    enable: false
  privacy_pack:
    enable: false
